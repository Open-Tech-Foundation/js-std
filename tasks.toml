[workspace]
members = ["apps/*", "packages/*", "website"]

[tasks.dev]
run = "rolldown -c --watch"
dir = "packages/std"

[tasks."dev:website"]
run = "otfw dev"
dir = "website"

[tasks.test]
run = "bun test"
dir = "packages/std"

[tasks.typecheck]
run = "tsc --noEmit"
dir = "packages/std"

[tasks.lint]
run = "biome check ."

[tasks.format]
run = "biome format --write ."

[tasks.build]
run = "rolldown -c"
dir = "packages/std"

[tasks."website#build"]
run = "otfw build --ssg"
dir = "website"

[tasks."build:website"]
deps = ["build", "website#build"]

# Bundles the whole spec suite into one runtime-agnostic ESM file.
[tasks."matrix:bundle"]
run = "bun __tests__/_matrix/build-bundle.js"
dir = "packages/std"

# Local sweep over every runtime on PATH. Read-only; CI is the source of truth
# because it covers multiple Node majors.
[tasks."matrix:run"]
run = "node packages/std/__tests__/_matrix/runtime-matrix.js"

[tasks.matrix]
deps = ["build", "matrix:bundle", "matrix:run"]

[tasks.ci]
deps = ["build", "lint", "typecheck", "test"]
parallel = true
